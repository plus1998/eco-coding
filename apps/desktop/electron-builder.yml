appId: com.eco.coding
productName: Eco Coding
copyright: Copyright © Eco Coding

directories:
  output: release
  buildResources: packaging

# icon.icns / icon.ico / icon.png in packaging/ (see `bun run icons`)

files:
  - dist/**/*
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/@anthropic-ai/**"
  # Native Codex CLI + platform binaries (and code-mode host) cannot run from inside asar.
  - "**/node_modules/@openai/**"
  - "**/node_modules/agent-browser/**"
  # pi-mcp-adapter OAuth credential store (external native binding).
  - "**/node_modules/@napi-rs/keyring/**"
  - "**/node_modules/@napi-rs/keyring-*/**"

# Platform agent-browser native binary for CDP-driven Agent tools.
extraResources:
  - from: packaging/agent-browser/
    to: agent-browser
    filter:
      - "**/*"
  - from: packaging/skills/
    to: skills
    filter:
      - "**/*"
  - from: packaging/eco-browser-mcp-stdio.mjs
    to: eco-browser-mcp-stdio.mjs
  - from: packaging/eco-image-generation-mcp-stdio.mjs
    to: eco-image-generation-mcp-stdio.mjs
  - from: packaging/eco-image-view-mcp-stdio.mjs
    to: eco-image-view-mcp-stdio.mjs

npmRebuild: false
nodeGypRebuild: false

# GitHub provider metadata is embedded in app-update.yml. The release job owns
# uploading assets, so pack-release.mjs always passes --publish never.
publish:
  provider: github
  channel: latest

# GitHub does not infer the release channel from a prerelease tag.
detectUpdateChannel: false
generateUpdatesFilesForAllChannels: false

mac:
  # The first beta is intentionally unsigned. Enable signing and notarization
  # before turning on macOS automatic updates.
  identity: null
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: Eco Coding needs microphone access for voice transcription.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Eco-Coding-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Eco-Coding-${version}-win-x64.${ext}

linux:
  executableName: eco-coding
  synopsis: Eco Coding
  description: Eco Coding desktop app
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  artifactName: Eco-Coding-${version}-linux-x64.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
