appId: com.eco.coding
productName: Eco Coding
copyright: Copyright © Eco Coding

directories:
  output: release
  buildResources: packaging

# icon.icns / icon.ico / icon.png in packaging/ (see `bun run icons`)

files:
  - dist/**/*
  - package.json

asar: true
asarUnpack:
  - "**/node_modules/@anthropic-ai/**"
  # Native Codex CLI + platform binaries (and code-mode host) cannot run from inside asar.
  - "**/node_modules/@openai/**"
  - "**/node_modules/agent-browser/**"
  - "**/node_modules/@qwen-code/open-computer-use/**"
  # pi-mcp-adapter OAuth credential store (external native binding).
  - "**/node_modules/@napi-rs/keyring/**"
  - "**/node_modules/@napi-rs/keyring-*/**"
  # Win32 Job Object FFI for ACP process-tree cleanup (Zed-aligned).
  - "**/node_modules/koffi/**"

# Platform agent-browser native binary for CDP-driven Agent tools.
extraResources:
  - from: packaging/agent-browser/
    to: agent-browser
    filter:
      - "**/*"
  - from: packaging/open-computer-use/
    to: open-computer-use
    filter:
      - "**/*"
  - from: packaging/skills/
    to: skills
    filter:
      - "**/*"
  # Legacy debug-only; agents use HTTP MCP. Keep for offline stdio probing.
  - from: packaging/eco-computer-use-mcp-stdio.mjs
    to: eco-computer-use-mcp-stdio.mjs

npmRebuild: false
nodeGypRebuild: false

afterPack: scripts/after-pack.mjs

# Generic feed URL is embedded in app-update.yml. Channel yml pointers live on the
# long-lived `desktop-update-feed` GitHub Release; binaries stay on versioned tags.
# pack-release.mjs always passes --publish never and overrides publish.url.
publish:
  provider: generic
  url: https://github.com/plus1998/eco-coding/releases/download/desktop-update-feed
  channel: latest

detectUpdateChannel: false
generateUpdatesFilesForAllChannels: false

mac:
  # The first beta is intentionally unsigned. Enable signing and notarization
  # before turning on macOS automatic updates.
  identity: null
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: Eco Coding needs microphone access for voice transcription.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Eco-Coding-${version}-mac-${arch}.${ext}

win:
  icon: packaging/icon.ico
  signAndEditExecutable: false
  artifactName: Eco-Coding-${version}-win-x64.${ext}
  signtoolOptions:
    sign: scripts/win-sign.mjs
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64

linux:
  executableName: eco-coding
  synopsis: Eco Coding
  description: Eco Coding desktop app
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  artifactName: Eco-Coding-${version}-linux-x64.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
